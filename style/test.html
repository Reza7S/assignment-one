<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
<div class="banner-wrapper">
  
  <!-- ওপরের অংশ: মেয়ে ও গিফট বক্সের ওপরের অংশ এখানে থাকবে -->
  <div class="top-row">
    <!-- বামপাশের অর্ধেক: গিফট বক্সের ওপরের কনফেটি/খালি অংশ -->
    <div class="left-half-top"></div>
    
    <!-- ডানপাশের অর্ধেক: মেয়ে ও ডিসকাউন্ট ইমেজ -->
    <div class="right-half-top">
      <img src="/images/Group44.png" alt="50% Discount" class="discount-img">
      <img src="/images/Rectangle1.png" alt="Shopping Girl" class="girl-img">
    </div>
  </div>

  <!-- নিচের অংশ: মেয়ের ছবি শেষ হওয়ার পর লাল ব্যাকগ্রাউন্ড ও গিফট বক্স শুরু হবে -->
  <div class="bottom-row">
    <!-- লাল ব্যাকগ্রাউন্ড ইমেজ -->
    <img src="/images/Rectangle2.png" alt="Red Background" class="red-bg-image">
    
    <!-- গিফট বক্স (যা বামপাশের ঠিক অর্ধেক জায়গা জুড়ে বসবে) -->
    <img src="/images/Group75.png" alt="Gift Box" class="gift-box">
  </div>

</div>


</body>
</html>
